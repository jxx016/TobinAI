[project]
name = "lead-chase-agent"
version = "0.1.0"
description = "Autonomous lead chase agent: enrich, draft, critique, approve, and follow up."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10.4",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langgraph>=1.0",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
    "langgraph-checkpoint-postgres>=2.0",
]
llm = [
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[project.scripts]
lead-chase-api = "src.api.main:run"
lead-chase-eval = "src.reflection.eval_harness:main"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
